<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zion Kidd — portfolio of shipped products, including Vine to Wine and a personal fitness tracker." />
    <meta name="color-scheme" content="dark light" />
    <title>Zion Kidd — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint to avoid a flash of the wrong theme.
      // Mirrors the logic in src/hooks/useTheme.ts. Dark is the default
      // direction site-wide; light only applies once a visitor has
      // explicitly toggled it (no system-preference fallback).
      (function () {
        try {
          var stored = window.localStorage.getItem('zionkidd-portfolio-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          // localStorage unavailable — bare :root in tokens.css is already dark.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
